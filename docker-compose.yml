services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  agent:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    stdin_open: true
    tty: true
    volumes:
      - ./logs:/app/logs          # persist structured logs on host

volumes:
  ollama_data:
