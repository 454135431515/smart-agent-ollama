[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smart-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests==2.31.0",
    "python-dotenv==1.0.1",
    "defusedxml==0.7.1",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tools*"]
